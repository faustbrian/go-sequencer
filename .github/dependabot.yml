version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/**"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        group-by: dependency-name
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
